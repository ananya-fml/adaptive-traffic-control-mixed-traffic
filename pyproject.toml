[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lanka-signal"
version = "0.1.0"
description = "Licence-free audit tooling for a queue-adaptive VISSIM signal controller and its exploratory SUMO migration (Lanka, Varanasi)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ananya Saha" }]
dependencies = ["pandas>=2.0", "numpy>=1.24", "matplotlib>=3.7", "scipy>=1.10"]

[project.optional-dependencies]
sumo = ["eclipse-sumo==1.28.0", "libsumo==1.28.0", "traci==1.28.0"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
