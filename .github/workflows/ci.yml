name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python analysis/replay_legacy_controller.py
      - run: python analysis/make_figures.py
      - name: figures and derived tables are reproducible
        run: git diff --exit-code -- data/derived/legacy_replay.csv data/derived/legacy_allocation_curve.csv
      - run: cd experimental/max_pressure && python test_logic.py
